name: Laghaim Daily Ranking & XP Scraper

on:
  schedule:
    # Runs at 23:15 UTC (00:15 CET Winter / 01:15 CEST Summer)
    - cron: '15 23 * * *'
  
  # Allows manual execution anytime from the GitHub "Actions" tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          playwright install chromium --with-deps

      - name: Run Laghaim Scraper Script
        run: python laghaim_rankings.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/data.json
          if git diff --staged --quiet; then
            echo "No changes in data.json to commit."
          else
            git commit -m "auto: update ranking snapshot and daily XP data [skip ci]"
            git push
          fi